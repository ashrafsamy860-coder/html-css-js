    <h1>Nova AI</h1>
  </header> 

  <div class="container" id="mainContainer">
    <aside class="sidebar" id="sidebar"> 
      <button id="newChatBtn" class="new-chat-btn">
        <i class="fa-solid fa-plus"></i> محادثة جديدة
      </button> 
      
      <div class="history-header">المحادثات السابقة</div>
      <ul class="chat-history" id="chatHistoryList"></ul>
      
      <div class="auth-container">
        <button id="showLoginBtn" class="action-btn login-action">
          <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول
        </button>
        <div class="divider"><span>أو</span></div>
        <div class="signup-section">
          <p class="question-text">ليس لديك حساب؟</p>
          <button id="showSignupBtn" class="action-btn signup-action">إنشاء حساب جديد</button>
        </div>
      </div>
    </aside> 

    <main class="main"> 
      <div class="chat-display" id="chatDisplay"></div>
      <form class="input-form" id="chatForm"> 
        <textarea id="userInput" class="textarea" placeholder="اكتب رسالتك....." rows="1"></textarea> 
        <button type="submit" class="send-btn" id="sendBtn">
          <i class="fa-solid fa-paper-plane"></i>
        </button> 
      </form> 
    </main> 
  </div>

  <!-- صفحة تسجيل الدخول -->

      <h2>تسجيل الدخول إلى Nova AI</h2>
      <form id="loginForm">
        <div class="login-input-group">
          <label>البريد الإلكتروني</label>
          <input type="email" class="login-input" placeholder="example@nova.ai" required>
        </div>
        <div class="login-input-group">
          <label>كلمة المرور</label>
          <input type="password" class="login-input" placeholder="••••••••" required>
        </div>
        <button type="submit" class="login-submit">دخول</button>
      </form>
      <a href="#" class="back-link" id="backToChatFromLogin">
        <i class="fa-solid fa-arrow-right"></i> العودة للمحادثة
      </a>
      <p class="switch-page-text">
        ليس لديك حساب؟ 
        <a href="#" id="goToSignup">إنشاء حساب</a>
      </p>
    </div>
  </div>

      <h2 class="mini-title">إنشاء حساب</h2>
      <form id="signupForm">
        <div class="login-input-group mini-group">
          <label class="mini-label">الاسم</label>
          <input type="text" class="login-input mini-input" placeholder="محمد أحمد" required>
        </div>
        <div class="login-input-group mini-group">
          <label class="mini-label">البريد</label>
          <input type="email" class="login-input mini-input" placeholder="example@nova.ai" required>
        </div>
        <div class="login-input-group mini-group">
          <label class="mini-label">كلمة المرور</label>
          <input type="password" id="signupPassword" class="login-input mini-input" placeholder="••••••••" minlength="6" required>
        </div>
        <div class="login-input-group mini-group">
          <label class="mini-label">تأكيد المرور</label>
          <input type="password" id="signupConfirmPassword" class="login-input mini-input" placeholder="••••••••" minlength="6" required>
        </div>
        <button type="submit" class="login-submit mini-submit">إنشاء</button>
      </form>
      <button class="back-button" id="backToChatFromSignup">
        <i class="fa-solid fa-arrow-right"></i> العودة
      </button>
      <p class="switch-page-text mini-switch">
        لديك حساب؟ 
        <a href="#" id="goToLogin">دخول</a>
      </p>
    </div>
  </div>
